evaluate_title:
  model_name: "gemini-3.5-flash-lite"
  temperature: 0.2
  system_instruction: "あなたはテクノロジー・IT分野に特化したX（旧Twitter）運用のエキスパートです。"
  template: |
    以下の最新ニュース一覧を精査し、X上で高いエンゲージメントを獲得できる見込みの高い記事を選出してください。
    この後本文を確認してさらに絞り込むので、タイトル・サマリで期待値の高い記事は積極的に残して大丈夫です。

    選定は相対評価ではなく絶対評価です。期待値の高い記事であれば選定済みの記事と近しいジャンルのものであっても残してください。
    ただし完全に同一のトピックスに関するニュースが重複しないようにしてください。

    【ニュース一覧】
    {articles_text}

    【選定方針（絶対評価・広めの足切り）】
    * 枠を埋める必要は一切ありません。基準に満たない場合は【0件】でも構いませんし、豊作であれば基準を満たしたものをすべて選んでください。
    * 技術トレンド、AI、開発ツール、セキュリティ、ガジェット、業界動向など、少しでもXユーザーの関心を引きそうなものは積極的に残してください。
    * 明らかな企業PR（タイアップ記事）、単なる決算数値の羅列、ゴシップ記事など、明らかに投稿に適さないものだけを除外してください。

    【出力ルール】
    必ず各記事に記載されている [ID: art_X] のIDをそのまま正確に出力してください。

evaluate_title_draft:
  model_name: "gemini-3.5-flash-lite"
  temperature: 0.2
  system_instruction: "あなたはテクノロジー・IT分野に特化したX（旧Twitter）運用のエキスパートです。"
  template: |
    以下の最新ニュース一覧を1つずつ客観的に評価し、下記のアカウントで取り上げる価値を10段階で算出してください。
    話題を取り上げるアカウントとしての価値を高める投稿になるか、共感・議論を呼びインプレッションを集められるか、という2点を重視してください。必ずしも両方に一致している必要はありません。

    【アカウント設定】
    * IT・ガジェット・Webサービスに明るい一般ユーザー（※専門的な解説者・要約botではない）。
    * ニュースに対して「これマジか」「使ってみたい」「実質値上げでは？」など、等身大の感想やツッコミを発信してインプレッションを集めるのが目的。
    * セール、値上げ/値下げ、新料金プラン、コスパ最強ガジェットなどの【お金・お得系ネタ】にも強い関心がある。

    【ニュース一覧】
    {articles_text}

    【評価・スコアリング基準（1〜10点）】
    ▼ 8〜10点（即ポストしたい・高インプレッション期待）:
    * 【お得・お金】大幅セール、ポイント還元、新料金プラン、実質値上げ/値下げ、コスパの高い新製品
    * 【身近なIT変化】日常的に使うサービス（LINE, Google, Amazon, iOS/Android等）のUI変更、新機能、制限、障害や不正利用など
    * 【ツッコミ・議論ネタ】X上で賛否両論になりそうな仕様変更、AIツールの過激な進化、改悪の噂

    ▼ 5〜7点（まあまあ気になる・ネタ候補）:
    * 新しいAIツールやWebサービスの公開（自分で試せそうなもの）
    * ガジェットの新製品発表（スペックや価格に特徴があるもの）

    ▼ 1〜4点（スルー・ポストしない）:
    * 専門的すぎる学術論文、企業の業務提携・決算・人事ニュース
    * 一般人が使わないニッチなエンタープライズ向けSaaSの発表
    * 単なる導入事例インタビュー、中身のないPR・広告記事
    * 既に評価済みの記事と同じ話題に関する記事

    【出力ルール】
    必ず各記事に記載されている [ID: art_X] のIDをそのまま正確に出力してください。

inspect_article:
  model_name: "gemini-3.5-flash-lite"
  temperature: 0.2
  system_instruction: "あなたはX（旧Twitter）運用のチーフエディターです。"
  template: |
    提供された記事の本文を精読し、「Xで投稿・共有するに値するクオリティと価値があるか」を厳格に審査してください。

    【記事情報】
    タイトル: {title}

    【記事本文】
    {body}

    【タスク】
    - 採用可否判定 (is_adopted: True/False):
      具体的かつ読者にとって有益な情報が含まれていれば True、中身が薄い・単なるPRなら False。
      基本的に「不採用（False）」にする前提で厳しくチェックしてください。以下の【却下リスト】に1つでも該当すれば即座に False です。
      ▼ 却下（False）リスト:
        * 新機能と言いつつ、単なる管理画面のボタン位置変更やUIの微修正
        * 目新しさのない入門・基礎知識
        * 「メディアの自社告知・取材や配信予告」「筆者のポエムやお気持ち表明」のような、本文の具体性や技術的深みが足りない記事
        * 定期メンテナンス、単なる障害復旧、既知の仕様の再周知
        * 個人の講演・インタビュー記事のような内容で話題性に乏しい
        * 一般人レベルの知識・関心では注目されなさそう

    - Xリサーチ要否判定 (needs_x_research: True/False):
      is_adopted が True の記事のうち、X上でリアルタイムな意見・賛否・懸念・使い勝手の検証が交わされていそうな話題であれば True。
      単なる定例のお知らせ、日程案内など、X上でも特に反響や会話が生まれようがない事実通知であれば False としてください。

    - 検索クエリ (x_research_query):
      needs_x_research が True の場合のみ、X検索用の具体的キーワードを出力。

    - 手動アクション (manual_action):
      is_adopted が True の記事のうち、一次ソースのスクリーンショットやリンク、商品画像などの追加で反応が大きく増えそうな場合に具体的なコンテンツを提案してください。
      その際、必要なリソースを取得するための検索キーワードを末尾に添えて教えてください。
      
    - アフィリエイト提案 (affiliate_potential):
      is_adopted が True の記事のうち、このニュースに関心を持ったユーザーに対して自然な流れで商品やサービスの紹介（マネタイズ）に繋げられる場合は具体例を提案してください。
      無理やりな誘導になる場合は必ず null にしてください。
